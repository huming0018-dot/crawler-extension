<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众包美食家 · 运行状态</title>
<style>
  :root{--brand:#b45309;--bg:#0f141b;--card:#1a2230;--ink:#e5e9f0;--sub:#8b94a7;--ok:#34d399;--err:#f87171;--warn:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:-apple-system,'PingFang SC',sans-serif;color:var(--ink);padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:19px;margin-bottom:2px}
  .sub{color:var(--sub);font-size:12px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border-radius:12px;padding:14px}
  .stat .v{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .stat.ok .v{color:var(--ok)} .stat.warn .v{color:var(--warn)}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin-bottom:8px;color:var(--sub)}
  table{width:100%;font-size:12px;border-collapse:collapse}
  td,th{padding:6px 4px;text-align:left;border-bottom:1px solid #263042}
  th{color:var(--sub);font-weight:400}
  .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:10px}
  .tag.a{background:#064e3b;color:#6ee7b7}
  .tag.r{background:#4c1d1d;color:#fca5a5}
  .tag.d{background:#3f3a1d;color:#fde68a}
  .bar{height:6px;background:#263042;border-radius:3px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
  .muted{color:var(--sub)}
</style>
</head>
<body>
<h1>🍜 众包美食家 · 运行状态</h1>
<p class="sub"><span id="genAt">载入中…</span> · 每分钟自动刷新 · 数据在云端，电脑关机也能看</p>

<div class="grid">
  <div class="stat ok"><div class="v" id="stAccepted">-</div><div class="l">累计收录（今日 <span id="stToday">-</span>）</div></div>
  <div class="stat warn"><div class="v" id="stOpen">-</div><div class="l">开放任务</div></div>
  <div class="stat"><div class="v" id="stActive">-</div><div class="l">24h 活跃参与者</div></div>
  <div class="stat"><div class="v" id="stRate">-</div><div class="l">累计拒收率</div></div>
</div>

<div class="card">
  <h2>任务分布</h2>
  <div id="taskDist" class="muted">-</div>
  <div class="bar"><i id="taskBar" style="width:0%"></i></div>
</div>

<div class="card">
  <h2>最近 10 条提交</h2>
  <table>
    <tr><th>时间</th><th>门店</th><th>参与者</th><th>裁决</th></tr>
    <tbody id="recentRows"><tr><td colspan="4" class="muted">载入中…</td></tr></tbody>
  </table>
</div>

<script>
(function(){
"use strict";
const API_BASE = "https://bdwrhshgdeghgyzwpxnl.supabase.co";
const API_KEY = "sb_publishable_c93XenGzZsoa308e3bTg6A__lfaqQ-B";
const $ = (id) => document.getElementById(id);

async function load() {
  try {
    const r = await fetch(API_BASE + "/rest/v1/rpc/crowd_status_summary", {
      method: "POST",
      cache: "no-store",
      headers: {"Content-Type":"application/json","apikey":API_KEY,"Authorization":"Bearer "+API_KEY},
      body: "{}"
    });
    const d = await r.json();
    if (!d.ok) throw new Error("bad");
    $("genAt").textContent = "更新于 " + new Date(d.generated_at).toLocaleString();
    $("stAccepted").textContent = d.flow.accepted_total;
    $("stToday").textContent = "+" + d.flow.accepted_today;
    $("stOpen").textContent = d.tasks.open + (d.tasks.in_progress ? "（进行中 " + d.tasks.in_progress + "）" : "");
    $("stActive").textContent = d.participants.active_24h + " / " + d.participants.total;
    const denom = d.flow.accepted_total + d.flow.rejected_total;
    $("stRate").textContent = denom ? Math.round(d.flow.rejected_total * 100 / denom) + "%" : "-";
    $("taskDist").textContent = "开放 " + d.tasks.open + " · 进行中 " + d.tasks.in_progress +
      " · 已完成 " + d.tasks.fulfilled + " · 关闭 " + d.tasks.closed + "（共 " + d.tasks.total + "）";
    const pct = d.tasks.total ? Math.round((d.tasks.fulfilled + d.tasks.closed) * 100 / d.tasks.total) : 0;
    $("taskBar").style.width = pct + "%";
    const rows = (d.recent || []).map(r => {
      const t = new Date(r.created_at);
      const hh = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
      const tag = r.gate_status === "accepted" ? '<span class="tag a">收录</span>'
        : r.gate_status === "rejected" ? '<span class="tag r">拒收</span>'
        : '<span class="tag d">重复</span>';
      return "<tr><td>" + hh + "</td><td>" + (r.matched_store || "—") + "</td><td>" +
        (r.participant_id || "").slice(0, 9) + "</td><td>" + tag + "</td></tr>";
    });
    $("recentRows").innerHTML = rows.length ? rows.join("") : '<tr><td colspan="4" class="muted">还没有提交</td></tr>';
  } catch (e) {
    $("genAt").textContent = "刷新失败，稍后自动重试";
  }
}
load();
setInterval(load, 60000);
// 手机浏览器会冻结后台标签页的定时器——回到前台立即刷新，不等下一分钟
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
window.addEventListener("pageshow", (e) => { if (e.persisted) load(); }); // bfcache 恢复时刷新
})();
</script>
</body>
</html>
