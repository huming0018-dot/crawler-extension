<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>众包美食家 · Owner 口味评价</title>
<style>
  :root{--brand:#b45309;--bg:#0f141b;--card:#1a2230;--ink:#e5e9f0;--sub:#8b94a7;--ok:#34d399;--err:#f87171;--warn:#fbbf24}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:-apple-system,'PingFang SC',sans-serif;color:var(--ink);padding:16px;max-width:560px;margin:0 auto}
  h1{font-size:19px;margin-bottom:2px}
  .sub{color:var(--sub);font-size:12px;margin-bottom:14px}
  .card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{font-size:14px;margin-bottom:8px;color:var(--sub)}
  label{display:block;font-size:12px;color:var(--sub);margin:10px 0 4px}
  input,textarea{width:100%;background:#0f1622;border:1px solid #263042;border-radius:8px;color:var(--ink);padding:9px 10px;font-size:14px;font-family:inherit}
  input:focus,textarea:focus{outline:none;border-color:var(--brand)}
  textarea{resize:vertical;min-height:72px}
  .stars{display:flex;gap:6px;margin:4px 0 2px}
  .star{font-size:30px;line-height:1;color:#374151;cursor:pointer;background:none;border:none;padding:0 2px}
  .star.on{color:var(--warn)}
  .star-label{font-size:12px;color:var(--sub);margin-left:6px;align-self:center}
  .row-meta{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
  .cnt{font-size:11px;color:var(--sub)}
  .cnt.ok{color:var(--ok)}
  .btn{width:100%;margin-top:14px;padding:11px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .btn:disabled{background:#263042;color:#5b6478;cursor:default}
  #msg{margin-top:10px;font-size:13px;text-align:center;min-height:18px}
  #msg.ok{color:var(--ok)} #msg.err{color:var(--err)}
  .hint{font-size:11px;color:var(--sub);margin-top:2px}
</style>
</head>
<body>
<h1>🍜 Owner 口味评价</h1>
<p class="sub">口味评分体系 · M0 主标尺采集（设计稿 §3.1：owner 评分即 1-5 绝对刻度）</p>

<div class="card">
  <h2>到店评分</h2>

  <label for="store">店名</label>
  <input id="store" list="storeList" placeholder="输入店名（可从候选选）" autocomplete="off">
  <datalist id="storeList"></datalist>

  <label>评分</label>
  <div class="stars" id="stars"></div>

  <label for="reason">理由（≥8 字，不含标点）</label>
  <textarea id="reason" maxlength="500" placeholder="口味/菜品/火候……一句话说清为什么是这个分"></textarea>
  <div class="row-meta"><span class="cnt" id="cnt">0/8</span></div>

  <label for="compareTo">成对比较（可选）：这家店比哪家更好？</label>
  <input id="compareTo" list="storeList" placeholder="留空表示不做比较" autocomplete="off">
  <div class="hint">设计稿 §3.1：一次"A≻B"约等于 40 条众包评分的信息量</div>

  <label for="secret">Owner 密钥</label>
  <input id="secret" type="password" placeholder="owner_secret" autocomplete="off">

  <button class="btn" id="submit" disabled>提交评价</button>
  <div id="msg"></div>
</div>

<script>
(function(){
"use strict";
const API_BASE = "https://bdwrhshgdeghgyzwpxnl.supabase.co";
const API_KEY = "sb_publishable_c93XenGzZsoa308e3bTg6A__lfaqQ-B";
const $ = (id) => document.getElementById(id);

// 与服务端 regexp_replace(s,'[\s[:punct:]]','','g') 同口径：去空白+ASCII标点，中文标点计长
function reasonLen(s){ return String(s||"").replace(/[\s\x21-\x2F\x3A-\x40\x5B-\x60\x7B-\x7E]/g,"").length; }

let rating = 0;
const STAR_TEXT = ["", "1 星 · 不行", "2 星 · 一般", "3 星 · 可以", "4 星 · 好", "5 星 · 极好"];
const starsBox = $("stars");
const starBtns = [];
for (let s = 1; s <= 5; s++) {
  const b = document.createElement("button");
  b.type = "button"; b.className = "star"; b.textContent = "★"; b.dataset.v = s;
  b.onclick = () => {
    rating = s;
    starBtns.forEach(x => x.classList.toggle("on", Number(x.dataset.v) <= rating));
    $("starLabel").textContent = STAR_TEXT[rating];
    refresh();
  };
  starBtns.push(b);
  starsBox.appendChild(b);
}
const starLabel = document.createElement("span");
starLabel.className = "star-label"; starLabel.id = "starLabel";
starsBox.appendChild(starLabel);

function refresh() {
  const n = reasonLen($("reason").value);
  $("cnt").textContent = Math.min(n, 8) + "/8";
  $("cnt").className = "cnt" + (n >= 8 ? " ok" : "");
  $("submit").disabled = !(
    $("store").value.trim().length >= 2 &&
    rating >= 1 && rating <= 5 &&
    n >= 8 &&
    $("secret").value.length > 0
  );
}
["store","reason","compareTo","secret"].forEach(id => $(id).addEventListener("input", refresh));

// 密钥本地记忆（owner 私有设备，免每次输入）
try {
  const saved = localStorage.getItem("owner_secret");
  if (saved) { $("secret").value = saved; refresh(); }
} catch (e) {}

async function rpc(fn, body) {
  const r = await fetch(API_BASE + "/rest/v1/rpc/" + fn, {
    method: "POST", cache: "no-store",
    headers: {"Content-Type":"application/json","apikey":API_KEY,"Authorization":"Bearer "+API_KEY},
    body: JSON.stringify(body)
  });
  return r.json();
}

// 门店候选下拉（只读 RPC；失败不阻塞手输）
(async function loadStores(){
  try {
    const d = await rpc("crowd_fetch_stores", {});
    if (Array.isArray(d)) {
      $("storeList").innerHTML = d.map(s => {
        const opt = document.createElement("option");
        opt.value = s;
        return opt.outerHTML;
      }).join("");
    }
  } catch (e) { /* 候选加载失败仍可手动输入 */ }
})();

const FAIL_TEXT = {
  forbidden: "密钥错误",
  owner_secret_not_configured: "服务端尚未配置 owner_secret",
  store_invalid: "店名至少 2 个字",
  score_out_of_range: "评分需在 1-5",
  reason_too_short: "理由至少 8 个字（不含空格与标点）",
  compare_same_store: "比较对象不能是自己",
};

$("submit").onclick = async () => {
  const btn = $("submit");
  btn.disabled = true;
  const msg = $("msg");
  msg.className = ""; msg.textContent = "提交中…";
  try { localStorage.setItem("owner_secret", $("secret").value); } catch (e) {}
  try {
    const d = await rpc("crowd_owner_rate", {
      p_store: $("store").value.trim(),
      p_score: rating,
      p_reason: $("reason").value.trim(),
      p_compare_to: $("compareTo").value.trim() || null,
      p_secret: $("secret").value
    });
    if (d && d.ok) {
      msg.className = "ok";
      msg.textContent = "✓ 已记录：" + $("store").value.trim() + " " + rating + " 分" +
        ($("compareTo").value.trim() ? "（优于 " + $("compareTo").value.trim() + "）" : "");
      $("reason").value = ""; $("compareTo").value = "";
      rating = 0;
      starBtns.forEach(x => x.classList.remove("on"));
      starLabel.textContent = "";
    } else {
      msg.className = "err";
      msg.textContent = "失败：" + (FAIL_TEXT[d && d.reason] || (d && d.reason) || "未知错误");
    }
  } catch (e) {
    msg.className = "err";
    msg.textContent = "网络错误，请稍后重试";
  }
  refresh();
};
refresh();
})();
</script>
</body>
</html>
